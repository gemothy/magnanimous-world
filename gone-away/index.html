// hanging lanterns
// A cone of light you can see hanging in the humid air under each lamp. This is the
// cheapest thing in the scene that reads as expensive: additive, depth-write off, no
// shadow interaction, and it gives the bloom pass something soft to catch. Brightest
// at the apex where the lamp is, fading as it spreads toward the floor.
const shaftMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uColor:    {value: new THREE.Color(0xffb877)},
    uStrength: {value: 0.34}
  },
  vertexShader: [
    'varying float vH;',
    'varying vec3 vN;',
    'varying vec3 vV;',
    'void main(){',
    '  vH = uv.y;',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  vN = normalize(normalMatrix * normal);',
    '  vV = normalize(-mv.xyz);',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying float vH;',
    'varying vec3 vN;',
    'varying vec3 vV;',
    'uniform vec3 uColor;',
    'uniform float uStrength;',
    'void main(){',
    // vH is 1 at the cone's apex (the lamp) and 0 at the floor. The curve keeps the
    // haze denser near the shade instead of washing the whole cone evenly.
    '  float h = pow(clamp(vH, 0.0, 1.0), 1.55);',
    // Soften the silhouette. A hollow double-sided cone is crossed by exactly two
    // surfaces from any angle, so without this the alpha is flat and the cone reads as
    // a hard triangle. Facing-ratio fades it out toward the edges, which is also
    // roughly how far the eye actually looks through the haze.
    '  float face = pow(abs(dot(vN, vV)), 0.75);',
    '  float a = h * face * uStrength;',
    '  gl_FragColor = vec4(uColor * a, a);',
    '}'
  ].join('\n')
});

  add(0.22, 0.5, 1.25, M.rattan, 1.44, 0.75, 0);
  for(let i = -1; i <= 1; i++){

    p.rotation.x = -0.35; p.rotation.z = rnd(-0.1, 0.1);

    leg.position.set(i < 2 ? -1.3 : 1.3, 0.14, i % 2 ? -0.45 : 0.45);
    g.add(leg);
  }
  scene.add(g);
  // grounding pool under the sofa, rotated with it
  const cs = contactShadow(x, z, 4.2, 2.6, 0.016, 0.8);
  cs.rotation.z = -ry;
  blocker(x, z, 1.5);

    pos: new THREE.Vector3(x, 0, z).add(fwd.clone().multiplyScalar(0.12)),

  return g;
}

let valveOpen = false;
const valveWheel = new THREE.Group();
const valveSpin = new THREE.Group();
const fountainWater = new THREE.Group();
(function(){
  // Pipework, run point-to-point with fittings.
  //
  // This used to be three bare ten-sided cylinders crossing at right angles. No elbows,
  // so a corner was simply two sticks passing through each other; no couplings, so a
  // six-metre run was one extruded tube; and nothing strapping any of it down, so it
  // floated alongside the terrace. Plumbing is legible because of its joints — the
  // fittings are where a pipe stops reading as a cylinder — and this is the story's
  // core prop, so it has to survive being looked at.
  const UP = new THREE.Vector3(0, 1, 0);
  const XQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
  function pipeRun(a, b, r){
    const A = new THREE.Vector3().fromArray(a), B = new THREE.Vector3().fromArray(b);
    const dir = new THREE.Vector3().subVectors(B, A);
    const len = dir.length();
    const q = new THREE.Quaternion().setFromUnitVectors(UP, dir.clone().normalize());

    const tube = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), M.copper);
    tube.position.addVectors(A, B).multiplyScalar(0.5);
    tube.quaternion.copy(q);
    tube.castShadow = true; tube.receiveShadow = true;
    scene.add(tube);

    // A coupling and a strap roughly every metre and a half. The spacing is what gives
    // the run a sense of length; an unbroken tube has no scale at all.
    const n = Math.max(1, Math.round(len / 1.5));
    for(let i = 1; i < n; i++){
      const p = new THREE.Vector3().lerpVectors(A, B, i / n);
      const collar = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.5, r * 1.5, r * 1.2, 16), M.copper);
      collar.position.copy(p); collar.quaternion.copy(q); collar.castShadow = true;
      scene.add(collar);
      const strap = new THREE.Mesh(new THREE.TorusGeometry(r * 1.62, r * 0.26, 6, 14), M.dark);
      strap.position.copy(p);
      strap.quaternion.copy(q).multiply(XQ);
      scene.add(strap);
    }
    // Elbows. Spheres at the ends read as cast fittings and, more usefully, hide the
    // seam where two runs meet at ninety degrees.
    [A, B].forEach(function(p){
      const el = new THREE.Mesh(new THREE.SphereGeometry(r * 1.55, 14, 10), M.copper);
      el.position.copy(p); el.castShadow = true;
      scene.add(el);
    });
  }

  const PR = 0.09;
  pipeRun([-8.9, 0.00, -5.0], [-8.9, 3.40, -5.0], PR);    // riser at the wall
  pipeRun([-8.9, 1.15, -11.0], [-8.9, 1.15, -4.6], PR);   // run along the terrace
  pipeRun([-9.0, 1.15, -10.6], [-5.4, 1.15, -10.6], PR);  // spur out to the fountain

  // gauge, turned to face anyone standing at the valve
  const gauge = cyl(0.14, 0.14, 0.06, 14, M.brass, -8.94, 2.1, -5.0);
  gauge.rotation.z = Math.PI / 2;
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.11, 16), M.lampGlow);
  face.position.set(-8.86, 2.1, -5.0);
  face.rotation.y = Math.PI / 2;
  scene.add(face);

  // the wheel itself — mounted on the riser, facing into the room
  valveWheel.position.set(-8.78, 1.15, -5.0);
  valveWheel.rotation.y = -Math.PI / 2;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.045, 8, 18), M.brass);
  valveSpin.add(rim);
  for(let i = 0; i < 3; i++){
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.04, 0.04), M.brass);
    spoke.rotation.z = i * Math.PI / 3;
    valveSpin.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.16, 10), M.brass);
  hub.rotation.x = Math.PI / 2;
  valveSpin.add(hub);
  valveWheel.add(valveSpin);
  scene.add(valveWheel);
  blocker(-8.9, -5.0, 0.55);
  // Generous hit volume. The wheel is a thin torus with spokes, and playtesting found
  // it only targeted within about a 6-degree pitch window — far too fussy for the
  // object the whole story turns on. Invisible material, so it never draws.
  const vgrab = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 1.0, 1.0),
    new THREE.MeshBasicMaterial({visible: false})
  );
  valveWheel.add(vgrab);
  interactive(valveWheel, 'Open the valve', function(){ toggleValve(); });
  valveWheel.userData.isValve = true;

  // stone fountain out on the terrace
  cyl(1.35, 1.5, 0.62, 16, M.stone, -5.6, 0.16, -10.4);
  cyl(1.18, 1.18, 0.1, 16, M.dark, -5.6, 0.42, -10.4);
  cyl(0.22, 0.28, 1.5, 10, M.stone, -5.6, 1.1, -10.4);
  const spout = cyl(0.07, 0.07, 0.42, 8, M.brass, -5.6, 1.72, -10.18);
  spout.rotation.x = Math.PI / 2.4;

  // water that appears when the valve opens

// Foliage framing the opening.
//
// The lounge's whole reason to exist is the view, and the view was arriving as a bare
// rectangle of sea and sky with nothing at its edges — so the eye ran straight out of
// frame instead of being held. Every reference still frames that opening with planting,
// and it works because the leaves fall to near-silhouette against the moonlit water:
// the darkest values in the picture sit right next to the brightest, which is what
// gives the opening depth rather than reading as a hole cut in a wall.
//
// These are taller than the corner pots on purpose. They have to break the horizon line
// to do any framing at all; sitting entirely below it just adds clutter to the floor.
function frondCluster(x, z, h, spread){
  const potR = 0.34 * Math.max(1, h / 2.4);
  cyl(potR * 1.18, potR * 0.9, 0.62, 12, M.stone, x, 0.31, z);
  const blades = 15;
  for(let i = 0; i < blades; i++){
    // Two tiers, so the cluster has a dense skirt and a few tall leaves above it rather
    // than one flat fan — a single ring of planes reads as a shuttlecock.
    const tall = i % 3 === 0;
    const len = (tall ? h : h * 0.55) * rnd(0.85, 1.15);
    const l = new THREE.Mesh(new THREE.PlaneGeometry(len, len * 0.34), M.frond);
    // The pivot is the blade's centre, so half its length hangs below wherever this is
    // put. Lifting the tall tier by most of its own reach is what actually gets leaves
    // above the horizon — the first pass planted them at pot height and they read as
    // shrubbery on the floor.
    l.position.set(x, 0.60 + (tall ? len * 0.42 : len * 0.12), z);
    l.rotation.y = (i / blades) * Math.PI * 2 + rnd(-0.18, 0.18);
    // Near-vertical in the tall tier, arching out in the skirt.
    l.rotation.z = tall ? rnd(-1.42, -1.08) : rnd(-0.55, -0.20);
    l.translateX(len * 0.34 * (spread || 1));
    l.castShadow = false;
    scene.add(l);
  }
  blocker(x, z, 0.5);
}
// The big one is close to the camera and hard left, because framing is a function of how
// much of the frame edge the thing covers, not of how tall it is in the world — a plant
// out at the deck edge is simply a small plant. Against the moonlit water these fall to
// near-silhouette, which is the contrast the opening needs.
// The hero camera looks right of its own axis, so "hard left in the world" is not the
// same as "hard left in frame" — the first attempt sat at x=-5 and fell outside the 72°
// cone entirely. Solved against the framing instead of by eye: this one lands at about
// 33° off axis, just inside the left edge, roughly seven units out.
frondCluster(-3.0, -3.2, 2.9, 1.0);
frondCluster(-4.7, -5.4, 2.6, 1.0);
frondCluster( 5.4, -6.1, 2.3, 1.0);

// Vegetation across the island body.
//
// The land behind the lounge was correct for night — dark — but it was a featureless
// black wedge occupying a third of the arrival framing, and a silhouette with no incident
// in it reads as missing geometry rather than as a hillside. Scrub gives it an edge.
//
// One InstancedMesh, not a mesh per plant. At the density this needs to read as cover
// rather than as scattered decoration, the per-object route would be several hundred
// draw calls for something that is never closer than twenty units.
(function(){
  const PLANTS = LOW ? 140 : 420, PER = 5;
  const geo = new THREE.PlaneGeometry(1, 0.34);
  const im = new THREE.InstancedMesh(geo, M.frond, PLANTS * PER);
  im.castShadow = false; im.receiveShadow = false;
  // Instances are placed once and never move, so three.js can skip the per-frame matrix
  // upload and the frustum test on a bounding volume that spans the whole island.
  im.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  im.frustumCulled = false;

  const m4 = new THREE.Matrix4(), qt = new THREE.Quaternion(),
        eu = new THREE.Euler(), sc = new THREE.Vector3(), pv = new THREE.Vector3();
  let n = 0, tries = 0;
  while(n < PLANTS * PER && tries < 40000){
    tries++;
    const cx = rnd(-92, 92), cz = rnd(-38, 104);
    // Keep clear of the built footprint, the terrace and the walkable deck.
    if(Math.abs(cx) < 17 && cz > -18 && cz < 13) continue;
    const ch = landHeight(cx, cz);
    // Above the beach so nothing grows in the surf, and off the bare upper slopes.
    if(ch < 0.6 || ch > 15.5) continue;
    // Thin the planting out with noise instead of spreading it evenly — real cover comes
    // in stands with clearings between, and an even scatter reads as a texture.
    if(fbm2(cx * 0.028 + 4.4, cz * 0.028 - 1.9) < 0.44) continue;

    const scale = rnd(1.5, 3.6);
    for(let b = 0; b < PER && n < PLANTS * PER; b++, n++){
      const x = cx + rnd(-0.7, 0.7), z = cz + rnd(-0.7, 0.7);
      const y = landHeight(x, z);
      const len = scale * rnd(0.75, 1.2);
      eu.set(rnd(-1.25, -0.55), (b / PER) * Math.PI * 2 + rnd(-0.3, 0.3), rnd(-0.2, 0.2), 'YXZ');
      qt.setFromEuler(eu);
      sc.set(len, len, len);
      pv.set(x, y + len * 0.30, z);
      m4.compose(pv, qt, sc);
      im.setMatrixAt(n, m4);
    }
  }
  im.count = n;
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
})();

// Palms and boulders on the island body.
//
// Undergrowth alone left the hillside barren: it gives the ground a texture but nothing
// interrupts the ridgeline, and a smooth silhouette at night is indistinguishable from
// an untextured mass. What reads as jungle from a distance is the *skyline* — trunks and
// crowns crossing it — so this is really silhouette work rather than planting.
(function(){
  // Clear of the pavilion, the terrace and the walkable deck.
  const clear = function(x, z){ return Math.abs(x) < 20 && z > -20 && z < 16; };

  // Palms. Full meshes rather than instances because there are few of them and each
  // wants its own trunk lean and crown rotation — a field of identical palms is worse
  // than none. Clustered on the same noise as the undergrowth so they grow in stands.
  let placed = 0, tries = 0;
  const WANT = LOW ? 12 : 30;
  while(placed < WANT && tries < 6000){
    tries++;
    const x = rnd(-86, 86), z = rnd(-28, 94);
    if(clear(x, z)) continue;
    const y = landHeight(x, z);
    if(y < 0.8 || y > 13.0) continue;
    if(fbm2(x * 0.030 + 7.7, z * 0.030 + 2.2) < 0.44) continue;
    palm(x, z, rnd(5.0, 9.5), y);
    placed++;
  }

  // Boulders. One InstancedMesh — they are pure silhouette at this distance and none of
  // them needs to differ except in size and rotation, which the matrix carries.
  const ROCKS = LOW ? 40 : 120;
  const rock = new THREE.MeshStandardMaterial({color:0x14180f, roughness:1, metalness:0, flatShading:true});
  const rim = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), rock, ROCKS);
  rim.castShadow = false; rim.receiveShadow = false;
  rim.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  rim.frustumCulled = false;
  const m4 = new THREE.Matrix4(), qt = new THREE.Quaternion(),
        eu = new THREE.Euler(), sc = new THREE.Vector3(), pv = new THREE.Vector3();
  let r = 0; tries = 0;
  while(r < ROCKS && tries < 9000){
    tries++;
    const x = rnd(-92, 92), z = rnd(-34, 100);
    if(clear(x, z)) continue;
    // Down to the waterline this time — rocks belong in the surf as well as up the slope,
    // and the shoreline is where they do most for the silhouette.
    const y = landHeight(x, z);
    if(y < -1.8 || y > 14.0) continue;
    const s = rnd(0.5, 2.6) * (y < 0.6 ? 1.4 : 1.0);   // bigger ones down at the water
    eu.set(rnd(0, 3), rnd(0, 3), rnd(0, 3));
    qt.setFromEuler(eu);
    sc.set(s * rnd(0.8, 1.3), s * rnd(0.5, 0.9), s * rnd(0.8, 1.3));
    // Sink each one so it sits in the ground rather than resting on it like a dropped prop.
    pv.set(x, y + s * 0.22, z);
    m4.compose(pv, qt, sc);
    rim.setMatrixAt(r, m4);
    r++;
  }
  rim.count = r;
  rim.instanceMatrix.needsUpdate = true;
  scene.add(rim);
})();

// rocks at the waterline
for(let i = 0; i < 14; i++){
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.4, 1.1), 0), M.stone);
  r.position.set(rnd(-16, 16), rnd(-1.4, -0.5), rnd(-15.6, -13.6));
  r.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  r.castShadow = true; r.receiveShadow = true;
  scene.add(r);
}

// ---------------------------------------------------------------- the rest of the resort
// A curving row of guest villas receding down the shoreline, each with a lit window and
// a reflection on the water. This is the single strongest signal that the Magnanimis is
// a living, occupied, fully-booked hotel rather than one lamp-lit room on an empty coast —
// and at blue hour the warm windows against the blue water are the whole photograph.
(function(){
  // Unlit materials sit at full brightness regardless of distance, so at these values the
  // windows blew out to white slabs and read as lightboxes rather than lit rooms. Deep
  // amber keeps them warm once bloom and the grade have had their way with them.
  const villaWarm = new THREE.MeshBasicMaterial({color: 0xb4732e});
  const villaGlass = new THREE.MeshBasicMaterial({color: 0xc98139});
  // Reflection streaks. These were flat untextured quads and read exactly like what they
  // were — pale rectangles lying on the water, with hard edges and a visible end. A real
  // reflection is brightest under its source, breaks up as it comes toward you, and fades
  // to nothing; so the quad now carries a gradient that does all three and never shows a
  // border.
  const reflTex = (function(){
    const c = document.createElement('canvas');
    c.width = 32; c.height = 256;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0.00, 'rgba(255,190,120,0.95)');   // directly beneath the villa
    g.addColorStop(0.14, 'rgba(255,175,105,0.55)');
    g.addColorStop(0.42, 'rgba(255,165,95,0.22)');
    g.addColorStop(1.00, 'rgba(255,160,90,0.0)');     // dissolves before it reaches you
    x.fillStyle = g; x.fillRect(0, 0, 32, 256);
    // chop it into broken glints rather than a continuous ribbon
    x.globalCompositeOperation = 'destination-out';
    for(let i = 0; i < 90; i++){
      x.fillStyle = 'rgba(0,0,0,' + rnd(0.25, 0.8).toFixed(2) + ')';
      x.fillRect(0, Math.random() * 256, 32, rnd(0.6, 3.2));
    }
    // and taper the sides so there is never a straight vertical edge
    x.globalCompositeOperation = 'destination-in';
    const s = x.createLinearGradient(0, 0, 32, 0);
    s.addColorStop(0, 'rgba(0,0,0,0)'); s.addColorStop(0.5, 'rgba(0,0,0,1)');
    s.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = s; x.fillRect(0, 0, 32, 256);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  })();
  const reflMat = new THREE.MeshBasicMaterial({
    map: reflTex, color: 0xffffff, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });

  function villa(x, z, ry, s){
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = ry;
    g.scale.setScalar(s);

    // stilts and deck out over the water
    for(let i = 0; i < 4; i++){
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.6, 6), M.dark);
      p.position.set(i < 2 ? -2.2 : 2.2, 0.4, i % 2 ? -1.8 : 1.8);
      g.add(p);
    }
    const deck = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.28, 5.0), M.floor);
    deck.position.y = 1.75; g.add(deck);

    // body + a warm window wall facing the water
    const body = new THREE.Mesh(new THREE.BoxGeometry(5.0, 2.5, 3.8), M.panel);
    body.position.y = 3.1; g.add(body);
    // A lit room seen from across a bay is a narrow warm slot, not a glowing wall.
    const win = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 0.85), villaGlass);
    win.position.set(0, 3.2, 1.93); g.add(win);
    const spill = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 0.3), villaWarm);
    spill.position.set(0, 2.0, 1.99); spill.rotation.x = -0.5; g.add(spill);

    // thatched pitched roof
    const ang = 0.42;
    const rl = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.22, 4.6), M.thatch);
    rl.position.set(-1.35, 4.72, 0); rl.rotation.z = ang; g.add(rl);
    const rr = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.22, 4.6), M.thatch);
    rr.position.set(1.35, 4.72, 0); rr.rotation.z = -ang; g.add(rr);
    const ridgeC = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 4.7), M.thatch);
    ridgeC.position.y = 5.35; g.add(ridgeC);

    scene.add(g);

    // The reflection. A stretched additive quad lying just above the water, pointing back
    // toward the lounge — cheaper and steadier than a real reflection pass, and at this
    // distance it is indistinguishable from one.
    // pulled toward the viewer along the sightline so it trails off the villa, not sideways
    const toward = new THREE.Vector2(-x, -z).normalize();
    const refl = new THREE.Mesh(new THREE.PlaneGeometry(1.7 * s, 30 * s), reflMat);
    refl.rotation.x = -Math.PI / 2;
    refl.rotation.z = -Math.atan2(toward.x, toward.y);
    refl.position.set(x + toward.x * 15 * s, 0.14, z + toward.y * 15 * s);
    refl.renderOrder = 2;
    scene.add(refl);
  }

  // An arc following the bay, receding to the right of the lounge's view and shrinking
  // with distance so the shoreline reads as curving away.
  // Along the arm of the bay, well off to one side — never in the view out to sea.
  //
  // The first placement swept from dead ahead to the right, which put a row of lit
  // windows directly in the lounge's sightline and quietly destroyed the thing the whole
  // story runs on: you look out from here and there is nobody. Privacy is the product the
  // Magnanimis sells. The resort should only be visible when you turn your head.
  //
  // Concretely: at the lounge's ~90-degree view the frame spans |x| < |z|, so every villa
  // is placed with |x| comfortably greater than |z| — around 65-75 degrees off axis. Far
  // enough round the headland to be a neighbouring arm of the hotel, not a view.
  // The jetty. Overwater bungalows are always strung off a single timber walkway — without
  // it they are eleven huts standing in open sea with no way to reach them, which is what
  // made them read as abstract shapes rather than a hotel. The boardwalk also ties them
  // into one silhouette instead of a scatter of boxes.
  (function boardwalk(){
    const ax = 52, az = -16, bx = 52 + 118, bz = -16 - 58;
    const dx = bx - ax, dz = bz - az;
    const len = Math.hypot(dx, dz);
    const ang = Math.atan2(dx, dz);

    const deck = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.26, len + 12), M.floor);
    deck.position.set(ax + dx / 2, 1.62, az + dz / 2);
    deck.rotation.y = ang;
    deck.receiveShadow = true;
    scene.add(deck);

    // handrail down the seaward side
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, len + 12), M.beam);
    rail.position.set(ax + dx / 2 + Math.cos(ang) * 1.25, 2.42, az + dz / 2 - Math.sin(ang) * 1.25);
    rail.rotation.y = ang;
    scene.add(rail);

    // posts into the water, and rail uprights
    const steps = Math.round(len / 3.4);
    for(let s = 0; s <= steps; s++){
      const f = s / steps;
      const px = ax + dx * f, pz = az + dz * f;
      for(let side = -1; side <= 1; side += 2){
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 3.6, 6), M.dark);
        p.position.set(px + Math.cos(ang) * 1.1 * side, 0.15, pz - Math.sin(ang) * 1.1 * side);
        scene.add(p);
      }
      const up = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.82, 5), M.beam);
      up.position.set(px + Math.cos(ang) * 1.25, 2.05, pz - Math.sin(ang) * 1.25);
      scene.add(up);
    }
  })();

  const N = 11;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    const x = 52 + t * 118;
    const z = -16 - t * 58;
    // Face each villa's lit window back across the bay toward the lounge. Rotating them
    // along the arc instead pointed every window away and left a row of black boxes.
    villa(x, z, Math.atan2(-x, -z), 1.0 - t * 0.18);
  }
})();

// distant island + shore lights
(function(){
  // A five-sided cone has five silhouette edges, and from the lounge you see two of
  // them — which is exactly why the pitch's "one jagged peak" kept arriving as a flat
  // triangle. The fix is not more segments on a cone; a smooth cone reads as a tent.
  // It is ridges: buttresses running down the flanks, easing out at the summit so the
  // apex stays sharp, and a slightly concave profile near the base the way a real
  // stratovolcano sits.
  function volcanoGeo(radius, height, seed){
    const g = new THREE.ConeGeometry(radius, height, 30, 7, false);
    const p = g.attributes.position, v = new THREE.Vector3();
    for(let i = 0; i < p.count; i++){
      v.fromBufferAttribute(p, i);
      const r = Math.sqrt(v.x * v.x + v.z * v.z);
      if(r < 1e-4) continue;                       // leave the apex alone
      const ang = Math.atan2(v.z, v.x);
      const up  = (v.y + height / 2) / height;     // 0 at the base, 1 at the apex
      const ridge = Math.sin(ang * 5.0 + seed) * 0.50
                  + Math.sin(ang * 9.0 + seed * 2.1) * 0.26
                  + Math.sin(ang * 17.0 + seed * 0.7) * 0.11;
      // Concave flanks: pull the waist in, let the base flare. A straight-sided cone is
      // the single most recognisable "primitive" shape in the frame.
      const waist = 1.0 - 0.20 * Math.sin(Math.PI * up * 0.85);
      const k = (1.0 + ridge * 0.17 * Math.sin(Math.PI * Math.min(up, 0.985))) * waist;
      p.setXYZ(i, v.x * k, v.y, v.z * k);
    }
    g.computeVertexNormals();
    return g;
  }

  // Not the flat unlit silhouette the rest of the far scenery uses. At this size the
  // peak is a major shape in the frame and it needs the moon to model it — unlit, its
  // ridges are invisible and all that work goes to waste.
  const rockMat = new THREE.MeshStandardMaterial({color:0x16293c, roughness:1, metalness:0});

  const peak = new THREE.Mesh(volcanoGeo(46, 78, 0.0), rockMat);
  peak.position.set(120, 14, -430); peak.rotation.y = 0.6; scene.add(peak);
  const peak2 = new THREE.Mesh(volcanoGeo(30, 44, 2.3), rockMat);
  peak2.position.set(178, 5, -450); peak2.rotation.y = -1.1; scene.add(peak2);

  // The far shore was a BoxGeometry, so the bay's horizon had two right-angled corners
  // in it and read as a wall rather than as land. A curtain with a noisy top edge costs
  // the same and gives the bay a coastline.
  const ridgeGeo = new THREE.PlaneGeometry(460, 34, 140, 1);
  (function(){
    const p = ridgeGeo.attributes.position;
    for(let i = 0; i < p.count; i++){
      if(p.getY(i) <= 0) continue;                 // displace the skyline only
      const t = p.getX(i) / 460 * 6.283;
      const h = Math.sin(t * 1.7) * 0.55 + Math.sin(t * 4.3 + 1.7) * 0.27
              + Math.sin(t * 9.1 + 0.6) * 0.13 + Math.sin(t * 19.0 + 2.2) * 0.05;
      p.setY(i, p.getY(i) + h * 9.0);
    }
    ridgeGeo.computeVertexNormals();
  })();
  const ridge = new THREE.Mesh(ridgeGeo, M.silhouette);
  ridge.position.set(60, -4, -470); scene.add(ridge);

  const n = 70, pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
        siz = new Float32Array(n), alp = new Float32Array(n);
  for(let i = 0; i < n; i++){
    pos[i*3] = rnd(-90, 220); pos[i*3+1] = rnd(6, 13); pos[i*3+2] = rnd(-480, -440);
    col[i*3] = 1.0; col[i*3+1] = 0.72; col[i*3+2] = 0.42;
    siz[i] = rnd(1.2, 3.0); alp[i] = rnd(0.3, 0.9);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));
  scene.add(new THREE.Points(g, makePointsMat(260)));
})();

// ---------------------------------------------------------------- particle systems
function makeSystem(count, scale){
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3),
        siz = new Float32Array(count), alp = new Float32Array(count);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));
  const pts = new THREE.Points(g, makePointsMat(scale));
  pts.frustumCulled = false;
  scene.add(pts);
  return {geo: g, pts: pts, pos: pos, col: col, siz: siz, alp: alp, n: count, data: []};
}

const fire = makeSystem(LOW ? 90 : 150, 240);
