// ---------------------------------------------------------------- audio
const Sound = (function(){
  let AC = null, master = null, ambBus = null, fireBus = null, musicBus = null,
      musicFilter = null, waterBus = null, waterGain = null, fireGain = null,
      surfGain = null, delayWet = null;
  let noiseBuf = null, userBuffer = null, musicSource = null;
  let started = false, genOn = false, crackleOn = false;
  let nextBeat = 0, beat = 0, schedTimer = null;

  // ---- the record: a streamed <audio> element routed into the music bus ----
  // The album is 4 hours long, so decoding whole tracks into AudioBuffers is out
  // (one 4-minute track is ~85 MB of float PCM). A MediaElementAudioSourceNode
  // streams instead, starts instantly, and still passes through musicFilter so
  // the distance/occlusion mix applies exactly as it did to the generative loop.
  let trackEl = null, trackNode = null;
  let library = null, trackIndex = -1, surfaceOn = false;

  function noise(){
    const src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    return src;
  }
  function makeNoiseBuffer(){
    const len = AC.sampleRate * 3;
    const b = AC.createBuffer(1, len, AC.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    return b;
  }
  function lfo(rate, depth, target, base){
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = rate; g.gain.value = depth;
    o.connect(g).connect(target);
    target.value = base;
    o.start();
    return o;
  }

  function init(){
    if(AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = makeNoiseBuffer();

    master = AC.createGain(); master.gain.value = 0.0; master.connect(AC.destination);
    ambBus = AC.createGain(); ambBus.gain.value = 1.0; ambBus.connect(master);
    fireBus = AC.createGain(); fireBus.gain.value = 1.0; fireBus.connect(master);
    waterBus = AC.createGain(); waterBus.gain.value = 0.0; waterBus.connect(master);

    musicFilter = AC.createBiquadFilter();
    musicFilter.type = 'lowpass'; musicFilter.frequency.value = 3000;
    musicBus = AC.createGain(); musicBus.gain.value = 0.0;
    musicBus.connect(musicFilter).connect(master);

    const delay = AC.createDelay(1.0); delay.delayTime.value = 0.34;
    const fb = AC.createGain(); fb.gain.value = 0.3;
    delayWet = AC.createGain(); delayWet.gain.value = 0.22;
    delay.connect(fb).connect(delay);
    delay.connect(delayWet).connect(musicFilter);

    // surf
    const s = noise();
    const sf = AC.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 520;
    surfGain = AC.createGain(); surfGain.gain.value = 0.16;
    s.connect(sf).connect(surfGain).connect(ambBus);
    s.start();
    const swell = AC.createGain(); swell.gain.value = 1;
    lfo(0.07, 220, sf.frequency, 520);
    void swell;

    const s2 = noise();
    const sf2 = AC.createBiquadFilter(); sf2.type = 'bandpass';
    sf2.frequency.value = 2400; sf2.Q.value = 0.7;
    const g2 = AC.createGain(); g2.gain.value = 0.012;
    s2.connect(sf2).connect(g2).connect(ambBus);
    s2.start();
    lfo(0.11, 0.010, g2.gain, 0.014);

    // wind through the thatch
    const w = noise();
    const wf = AC.createBiquadFilter(); wf.type = 'bandpass';
    wf.frequency.value = 620; wf.Q.value = 0.5;
    const wg = AC.createGain(); wg.gain.value = 0.03;
    w.connect(wf).connect(wg).connect(ambBus);
    w.start();
    lfo(0.045, 0.022, wg.gain, 0.032);

    // night air — filtered noise only. Tonal oscillators read as electronic whine.
    const ni = noise();
    const nif = AC.createBiquadFilter();
    nif.type = 'bandpass'; nif.frequency.value = 3400; nif.Q.value = 1.2;
    const nig = AC.createGain(); nig.gain.value = 0.006;
    ni.connect(nif).connect(nig).connect(ambBus);
    ni.start();
    lfo(0.09, 0.004, nig.gain, 0.007);

    // fire bed
    const f = noise();
    const ff = AC.createBiquadFilter(); ff.type = 'lowpass'; ff.frequency.value = 340;
    fireGain = AC.createGain(); fireGain.gain.value = 0.09;
    f.connect(ff).connect(fireGain).connect(fireBus);
    f.start();

    // fountain bed (gain rides on valve state + distance)
    const wt = noise();
    const wtf = AC.createBiquadFilter(); wtf.type = 'bandpass';
    wtf.frequency.value = 1900; wtf.Q.value = 0.6;
    waterGain = AC.createGain(); waterGain.gain.value = 0.10;
    wt.connect(wtf).connect(waterGain).connect(waterBus);
    wt.start();

    crackleOn = true;
    crackle();
    started = true;
    master.gain.linearRampToValueAtTime(0.9, AC.currentTime + 2.5);
    window.__musicDelay = delay;
  }

  function burstNoise(dest, when, dur, freq, q, vol, type){
    const src = noise();
    const f = AC.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(f).connect(g).connect(dest);
    src.start(when); src.stop(when + dur + 0.02);
  }

  function crackle(){
    if(!crackleOn || !AC) return;
    const t = AC.currentTime + 0.01;
    burstNoise(fireBus, t, rnd(0.03, 0.13), rnd(700, 2600), rnd(2, 8), rnd(0.02, 0.09));
    setTimeout(crackle, rnd(90, 460));
  }

  function ping(f0, f1, dur, type, vol, dest){
    if(!AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ---- generative exotica, used until a track is loaded ----
  const SCALE = [220.0, 261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
  const BASS  = [110.0, 87.31, 73.42, 82.41];
  function vibe(freq, when, vol){
    const car = AC.createOscillator(), mod = AC.createOscillator(),
          mg = AC.createGain(), g = AC.createGain();
    car.type = 'sine'; mod.type = 'sine';
    car.frequency.value = freq;
    mod.frequency.value = freq * 3.01;
    mg.gain.value = freq * 1.1;
    mod.connect(mg).connect(car.frequency);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.9);
    car.connect(g);
    g.connect(musicBus);
    if(window.__musicDelay) g.connect(window.__musicDelay);
    car.start(when); mod.start(when);
    car.stop(when + 2.0); mod.stop(when + 2.0);
  }
  function bass(freq, when){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.11, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.1);
    o.connect(g).connect(musicBus);
    o.start(when); o.stop(when + 1.2);
  }
  function shaker(when, vol){
    burstNoise(musicBus, when, 0.05, 7200, 0.8, vol, 'highpass');
  }
  function bird(when){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(2100, when);
    o.frequency.exponentialRampToValueAtTime(3500, when + 0.07);
    g.gain.setValueAtTime(0.05, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    o.connect(g).connect(musicBus);
    o.start(when); o.stop(when + 0.1);
  }
  function vinylPop(when){
    burstNoise(musicBus, when, 0.012, rnd(1200, 5000), 4, rnd(0.01, 0.05));
  }
  function scheduler(){
    if(!genOn || !AC) return;
    const spb = 60 / 96;
    while(nextBeat < AC.currentTime + 0.3){
      const t = Math.max(nextBeat, AC.currentTime + 0.02);
      const bar = Math.floor(beat / 4) % 4;
      if(beat % 2 === 0) shaker(t, 0.018);
      if(beat % 4 === 0) bass(BASS[bar], t);
      if(Math.random() < 0.5) vibe(SCALE[Math.floor(Math.random() * SCALE.length)], t, 0.055);
      if(Math.random() < 0.12) vibe(SCALE[Math.floor(Math.random() * SCALE.length)], t + spb * 0.5, 0.035);
      for(let k = 0; k < 3; k++) if(Math.random() < 0.5) vinylPop(t + Math.random() * spb);
      nextBeat += spb;
      beat++;
    }
    schedTimer = setTimeout(scheduler, 60);
  }

  // Vinyl surface noise, scheduled only while a record is actually turning. This
  // is what makes a clean digital master read as a record playing in a room —
  // more than wow or flutter does, and without touching playbackRate.
  function surface(){
    if(!surfaceOn || !AC) return;
    const t = AC.currentTime + 0.01;
    for(let k = 0; k < 2; k++) vinylPop(t + Math.random() * 0.4);
    if(Math.random() < 0.12) burstNoise(musicBus, t, rnd(0.02, 0.06), rnd(600, 1800), 3, rnd(0.01, 0.03));
    setTimeout(surface, rnd(120, 420));
  }

  function ensureTrackNode(){
    if(trackNode) return;
    trackEl = new Audio();
    trackEl.preload = 'auto';
    trackEl.crossOrigin = 'anonymous';
    trackNode = AC.createMediaElementSource(trackEl);
    trackNode.connect(musicBus);
    // advance the stack on its own, so the room keeps playing unattended
    trackEl.addEventListener('ended', function(){
      if(library) api.playTrack(trackIndex + 1);
    });
  }

  const api = {
    init: init,
    ready: function(){ return started; },
    resume: function(){ if(AC && AC.state === 'suspended') AC.resume(); },

    // ---- record library ----
    loadLibrary: function(url, cb){
      fetch(url)
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(lib){
          if(!lib || !lib.tracks || !lib.tracks.length) throw new Error('empty library');
          library = lib;
          if(cb) cb(true, lib);
        })
        .catch(function(err){ if(cb) cb(false, null, err); });
    },
    hasLibrary: function(){ return !!(library && library.tracks.length); },
    libraryInfo: function(){ return library; },
    currentTrack: function(){
      if(!library || trackIndex < 0) return null;
      return library.tracks[((trackIndex % library.tracks.length) + library.tracks.length) % library.tracks.length];
    },
    // Plays library track i (wrapping). Returns the track, or null if no library.
    playTrack: function(i){
      if(!library || !library.tracks.length) return null;
      init();
      ensureTrackNode();
      const n = library.tracks.length;
      trackIndex = ((i % n) + n) % n;
      const t = library.tracks[trackIndex];
      genOn = false;
      if(schedTimer){ clearTimeout(schedTimer); schedTimer = null; }
      trackEl.src = t.src;
      const p = trackEl.play();
      if(p && p.catch) p.catch(function(){ /* autoplay gate — retried on next interact */ });
      musicBus.gain.cancelScheduledValues(AC.currentTime);
      if(!surfaceOn){ surfaceOn = true; surface(); }
      return t;
    },
    pauseTrack: function(){
      surfaceOn = false;
      if(trackEl && !trackEl.paused) trackEl.pause();
    },
    resumeTrack: function(){
      if(!trackEl || !trackEl.src) return false;
      const p = trackEl.play();
      if(p && p.catch) p.catch(function(){});
      if(!surfaceOn){ surfaceOn = true; surface(); }
      return true;
    },
    trackPlaying: function(){ return !!(trackEl && trackEl.src && !trackEl.paused); },
    // playback position and audio-graph health, for tuning and a now-playing readout
    position: function(){
      if(!trackEl) return null;
      return {
        time: trackEl.currentTime, duration: trackEl.duration || 0,
        paused: trackEl.paused, ready: trackEl.readyState,
        ctx: AC ? AC.state : 'none',
        busGain: musicBus ? musicBus.gain.value : null,
        cutoffHz: musicFilter ? Math.round(musicFilter.frequency.value) : null
      };
    },
    loadFile: function(file, cb){
      init();
      const fr = new FileReader();
      fr.onload = function(){
        AC.decodeAudioData(fr.result, function(buf){
          userBuffer = buf;
          if(cb) cb(true);
        }, function(){ if(cb) cb(false); });
      };
      fr.readAsArrayBuffer(file);
    },
    loadUrl: function(url, cb){
      init();
      fetch(url).then(function(r){ return r.arrayBuffer(); })
        .then(function(b){ return AC.decodeAudioData(b); })
        .then(function(buf){ userBuffer = buf; if(cb) cb(true); })
        .catch(function(){ if(cb) cb(false); });
    },
    hasTrack: function(){ return !!userBuffer; },
    startMusic: function(){
      if(!AC) return;
      musicBus.gain.cancelScheduledValues(AC.currentTime);
      musicBus.gain.setTargetAtTime(0.85, AC.currentTime, 0.8);
      // priority: whatever record is already on the platter, then the album, then a
      // dropped file, then the generative loop as the last resort.
      if(trackEl && trackEl.src){ api.resumeTrack(); return; }
      if(library && library.tracks.length){ api.playTrack(trackIndex < 0 ? 0 : trackIndex); return; }
      if(userBuffer){
        musicSource = AC.createBufferSource();
        musicSource.buffer = userBuffer;
        musicSource.loop = true;
        // a touch of wow, so it sits in the room rather than on top of it
        const w = AC.createOscillator(), wg = AC.createGain();
        w.frequency.value = 0.35; wg.gain.value = 0.0016;
        w.connect(wg).connect(musicSource.playbackRate);
        w.start();
        musicSource.connect(musicBus);
        musicSource.start();
      } else {
        genOn = true;
        nextBeat = AC.currentTime + 0.25;
        beat = 0;
        scheduler();
      }
    },
    stopMusic: function(){
      if(!AC) return;
      musicBus.gain.setTargetAtTime(0.0001, AC.currentTime, 0.35);
      api.pauseTrack();
      genOn = false;
      if(schedTimer){ clearTimeout(schedTimer); schedTimer = null; }
      if(musicSource){
        const src = musicSource; musicSource = null;
        setTimeout(function(){ try{ src.stop(); }catch(e){} }, 900);
      }
    },
    needle: function(down){
      if(!AC) return;
      burstNoise(master, AC.currentTime, down ? 0.09 : 0.05, 2600, 3, down ? 0.09 : 0.05);
      ping(down ? 180 : 260, down ? 90 : 150, 0.12, 'sine', 0.03);
    },
    valve: function(open){
      if(!AC) return;
      const t = AC.currentTime;
      for(let i = 0; i < 7; i++){
        burstNoise(master, t + i * 0.075, 0.07, 900 + i * 90, 6, 0.05, 'bandpass');
      }
      ping(open ? 90 : 150, open ? 150 : 80, 0.5, 'triangle', 0.05);
      if(open) burstNoise(master, t + 0.55, 1.4, 700, 0.7, 0.10);
    },
    doorRattle: function(){
      if(!AC) return;
      const t = AC.currentTime;
      burstNoise(master, t, 0.07, 320, 5, 0.09, 'bandpass');
      burstNoise(master, t + 0.11, 0.06, 260, 5, 0.07, 'bandpass');
    },
    step: function(){
      if(!AC) return;
      const t = AC.currentTime;
      burstNoise(master, t, 0.09, rnd(150, 260), 1.6, 0.045, 'lowpass');
      ping(rnd(110, 150), 60, 0.07, 'sine', 0.012);
    },
    sit: function(){
      if(!AC) return;
      burstNoise(master, AC.currentTime, 0.34, 420, 0.8, 0.05, 'lowpass');
    },
    update: function(camPos, seated, valveIsOpen){
      if(!AC || !started) return;
      const t = AC.currentTime;
      const dFire = camPos.distanceTo(FIRE_POS);
      fireBus.gain.setTargetAtTime(Math.min(1, 2.2 / (1 + dFire * 0.55)), t, 0.2);
      const dRec = camPos.distanceTo(new THREE.Vector3(-4.4, 1.1, 7.55));
      musicFilter.frequency.setTargetAtTime(
        THREE.MathUtils.clamp(11000 / (1 + dRec * 0.55), 700, 12000), t, 0.3);
      const sounding = genOn || musicSource || (trackEl && trackEl.src && !trackEl.paused);
      musicBus.gain.setTargetAtTime(
        sounding ? Math.min(0.95, 3.4 / (1 + dRec * 0.5)) : 0.0001, t, 0.3);
      const dWater = camPos.distanceTo(new THREE.Vector3(-5.6, 0.6, -10.4));
      waterBus.gain.setTargetAtTime(
        valveIsOpen ? Math.min(1, 2.4 / (1 + dWater * 0.7)) : 0.0001, t, 0.4);
      // the sea is louder out on the terrace
      const openness = THREE.MathUtils.clamp((2 - camPos.z) / 12, 0.35, 1.6);
      surfGain.gain.setTargetAtTime(0.14 * openness * (seated ? 1.15 : 1), t, 0.5);
    }
  };
  return api;
})();

// ---------------------------------------------------------------- interaction state
function toggleRecord(){
  recordPlaying = !recordPlaying;
  Sound.needle(recordPlaying);
  if(recordPlaying){
    Sound.startMusic();
    announceRecord();
  } else {
    Sound.stopMusic();
    note('');
  }
}

// ---------------------------------------------------------------- the collection
// Garmus's records, still shelved in his lounge. Per the pitch this is both the
// collectible loop and the emotional core: the sides you have played are the ones
// you have heard the way he heard them, so which ones you've found is worth keeping
// across sessions. This is also the build's first piece of save state.
const Collection = (function(){
  const KEY = 'goneaway.collection.v1';
  let heard = new Set();
  try {
    const raw = localStorage.getItem(KEY);
    if(raw) heard = new Set(JSON.parse(raw));
  } catch(e){ /* private mode, or a corrupt entry: start fresh rather than fail */ }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(Array.from(heard))); }
    catch(e){ /* nothing to do — the collection just won't survive the session */ }
  }
  return {
    // returns true the first time a given side is played
    mark: function(id){
      if(!id || heard.has(id)) return false;
      heard.add(id); persist(); return true;
    },
    has: function(id){ return heard.has(id); },
    count: function(){ return heard.size; }
  };
})();

// Reading the label. Lagoon Lounge deliberately never prints its track titles, but
// here the sleeve is a physical object in your hands, so you read it — quietly, and
// only for a moment.
function announceRecord(){
  const t = Sound.currentTrack();
  if(!t) return;
  const total = Sound.libraryInfo() ? Sound.libraryInfo().count : 0;
  const fresh = Collection.mark(t.id);
  let line = '“' + t.title + '”  ·  ' + t.artist;
  line += '\nside ' + t.n + ' of ' + total;
  if(fresh) line += '  ·  never played';
  line += '   —   ' + Collection.count() + ' of ' + total + ' heard';
  note(line);
}

// Flipping through the shelf: take the next side off the pile.
function nextRecord(){
  if(!Sound.hasLibrary()){ note('Empty sleeves. The records are somewhere else.'); return; }
  const cur = Sound.currentTrack();
  Sound.playTrack(cur ? cur.n : 0);   // n is 1-based, so this lands on the next side
  recordPlaying = true;
  Sound.needle(true);
  announceRecord();
}
function toggleValve(){
  valveOpen = !valveOpen;
  Sound.valve(valveOpen);
  fountainWater.visible = valveOpen;
  note(valveOpen ? 'Line three is live.' : 'Line three is shut.');
}

let seated = null, seatTimer = 0;
function sitDown(seat){
  seated = seat;
  seatTimer = 0;
  Sound.sit();
}
function standUp(){
  if(!seated) return;
  const fwd = new THREE.Vector3(-Math.sin(seated.yaw), 0, -Math.cos(seated.yaw));
  player.pos.copy(seated.pos).add(fwd.multiplyScalar(1.5));
  seated = null;
  seatTimer = 0;
}

let noteTimer = null;
function note(text){
  const el = document.getElementById('note');
  if(!text){ el.style.opacity = 0; return; }
  el.textContent = text;
  el.style.opacity = 1;
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ el.style.opacity = 0; }, 4200);
}

// ---------------------------------------------------------------- player + input
const player = {
  pos: new THREE.Vector3(2.6, 0, 6.4),
  vel: new THREE.Vector3(),
  yaw: 0.30, pitch: -0.05, bob: 0, stepAcc: 0
};
const keys = {};
let state = 'menu';

addEventListener('keydown', function(e){
  keys[e.code] = true;
  if(e.code === 'KeyE'){ interact(); }
  if(e.code === 'Escape' && seated) standUp();
});
addEventListener('keyup', function(e){ keys[e.code] = false; });

// One pixel of drag should turn the view by the angle that pixel actually
// covers. Using a flat per-pixel constant makes the two axes disagree whenever
// the frustum is not square, which reads as the view skewing rather than turning.
function angPerPixel(){
  const vf = camera.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  return {x: hf / innerWidth, y: vf / innerHeight};
}

addEventListener('mousemove', function(e){
  if(state !== 'play' || !document.pointerLockElement) return;
  const a = angPerPixel();
  player.yaw -= e.movementX * a.x * CFG.lookGainMouse;
  player.pitch -= e.movementY * a.y * CFG.lookGainMouse;
  player.pitch = THREE.MathUtils.clamp(player.pitch, -1.0, 0.95);
});

// touch: left half walks, right half looks
let tLook = null, tMove = null;
addEventListener('touchstart', function(e){
  if(state !== 'play') return;
  for(let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.clientX < innerWidth * 0.45 && !tMove) tMove = {id: t.identifier, x: t.clientX, y: t.clientY, dx: 0, dy: 0};
    else if(!tLook) tLook = {id: t.identifier, x: t.clientX, y: t.clientY};
  }
}, {passive: true});
addEventListener('touchmove', function(e){
  for(let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(tMove && t.identifier === tMove.id){
      tMove.dx = THREE.MathUtils.clamp((t.clientX - tMove.x) / 60, -1, 1);
      tMove.dy = THREE.MathUtils.clamp((t.clientY - tMove.y) / 60, -1, 1);
    } else if(tLook && t.identifier === tLook.id){
      const a = angPerPixel();
      player.yaw -= (t.clientX - tLook.x) * a.x * CFG.lookGainTouch;
      player.pitch -= (t.clientY - tLook.y) * a.y * CFG.lookGainTouch;
      player.pitch = THREE.MathUtils.clamp(player.pitch, -1.0, 0.95);
      tLook.x = t.clientX; tLook.y = t.clientY;
    }
  }
}, {passive: true});
addEventListener('touchend', function(e){
  for(let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(tMove && t.identifier === tMove.id) tMove = null;
    if(tLook && t.identifier === tLook.id) tLook = null;
  }
}, {passive: true});

// ---------------------------------------------------------------- targeting
const ray = new THREE.Raycaster();
ray.far = CFG.reach;
const centre = new THREE.Vector2(0, 0);
let target = null;

function updateTarget(){
  const el = document.getElementById('prompt');
  const ret = document.getElementById('reticle');
  if(seated){
    target = null;
    el.innerHTML = '<b>E</b> &nbsp;Stand';
    el.style.opacity = 1;
    ret.classList.remove('hot');
    return;
  }
  ray.setFromCamera(centre, camera);
  const hits = ray.intersectObjects(INTERACTIVE, true);
  const root = hits.length ? hits[0].object.userData.root : null;
  target = root || null;
  if(target && target.userData.act){
    let label = target.userData.act.label;
    if(target.userData.isRecord) label = recordPlaying ? 'Lift the needle' : 'Drop the needle';
    if(target.userData.isValve) label = valveOpen ? 'Close the valve' : 'Open the valve';
    el.innerHTML = '<b>E</b> &nbsp;' + label;
    el.style.opacity = 1;
    ret.classList.add('hot');
  } else {
    el.style.opacity = 0;
    ret.classList.remove('hot');
  }
}
function interact(){
  if(state !== 'play') return;
  if(seated){ standUp(); return; }
  if(target && target.userData.act) target.userData.act.fn();
}
addEventListener('click', function(){
  if(state === 'play' && isTouch) interact();
});

// ---------------------------------------------------------------- movement
function collide(p){
  // outer bounds: pavilion is narrower than the terrace
  const zMin = -13.4, zMax = 7.6;
  p.z = THREE.MathUtils.clamp(p.z, zMin, zMax);
  const xLim = p.z > -6.6 ? 8.9 : 10.6;
  p.x = THREE.MathUtils.clamp(p.x, -xLim, xLim);
  for(let i = 0; i < BLOCKERS.length; i++){
    const b = BLOCKERS[i];
    const dx = p.x - b.x, dz = p.z - b.z;
    const d = Math.hypot(dx, dz);
    const r = b.r + 0.34;
    if(d < r && d > 0.0001){
      p.x = b.x + dx / d * r;
      p.z = b.z + dz / d * r;
    }
  }
}

function updatePlayer(dt){
  if(seated){
    seatTimer += dt;
    player.pos.lerp(seated.pos, 1 - Math.pow(0.002, dt));
    if(seatTimer < 1.1){
      let d = seated.yaw - player.yaw;
      while(d > Math.PI) d -= Math.PI * 2;
      while(d < -Math.PI) d += Math.PI * 2;
      player.yaw += d * (1 - Math.pow(0.02, dt));
      player.pitch += (-0.06 - player.pitch) * (1 - Math.pow(0.05, dt));
    }
    player.vel.set(0, 0, 0);
    return;
  }
  let fx = 0, fz = 0;
  if(keys.KeyW || keys.ArrowUp) fz -= 1;
  if(keys.KeyS || keys.ArrowDown) fz += 1;
  if(keys.KeyA || keys.ArrowLeft) fx -= 1;
  if(keys.KeyD || keys.ArrowRight) fx += 1;
  if(tMove){ fx += tMove.dx; fz += tMove.dy; }
  const len = Math.hypot(fx, fz);
  if(len > 1){ fx /= len; fz /= len; }
  // forward = (-sin yaw, 0, -cos yaw); right = (cos yaw, 0, -sin yaw)
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const wx = fx * cos + fz * sin;
  const wz = fz * cos - fx * sin;
  const target2 = new THREE.Vector3(wx, 0, wz).multiplyScalar(CFG.walkSpeed);
  player.vel.x += (target2.x - player.vel.x) * Math.min(1, CFG.accel * dt);
  player.vel.z += (target2.z - player.vel.z) * Math.min(1, CFG.accel * dt);
  if(len < 0.01){
    player.vel.x -= player.vel.x * Math.min(1, CFG.damping * dt);
    player.vel.z -= player.vel.z * Math.min(1, CFG.damping * dt);
  }
  player.pos.addScaledVector(player.vel, dt);
  collide(player.pos);

  const speed = Math.hypot(player.vel.x, player.vel.z);
  player.bob += speed * dt * CFG.bobFreq * Math.PI;
  player.stepAcc += speed * dt;
  if(player.stepAcc > 1.55){ player.stepAcc = 0; Sound.step(); }
}

// ---------------------------------------------------------------- particle update
function updateFire(dt, time){
  for(let i = 0; i < fire.n; i++){
    const d = fire.data[i];
    d.life += dt;
    if(d.life > d.max) resetFire(i);
    const k = d.life / d.max;
    d.x += (d.vx + Math.sin(time * 2.2 + i) * 0.16) * dt;
    d.y += d.vy * dt;
    d.z += (d.vz + Math.cos(time * 1.8 + i * 0.7) * 0.16) * dt;
    d.vy += 0.55 * dt;
    fire.pos[i*3] = d.x; fire.pos[i*3+1] = d.y; fire.pos[i*3+2] = d.z;
    const heat = 1 - k;
    fire.col[i*3]   = 1.0;
    fire.col[i*3+1] = 0.26 + heat * 0.36;
    fire.col[i*3+2] = 0.05 + heat * 0.11;
    fire.siz[i] = d.size * (0.5 + heat * 0.9);
    // These particles are additive and they overlap heavily near the bowl, so alpha is
    // not opacity here — it is how fast the stack saturates. At 0.85 the core reached
    // white well before the flame had any shape, which is why the firepit read as a
    // blown blob and why it alone accounted for most of the frame's clipped pixels.
    // Lower alpha lets more layers accumulate before clipping, so the flame keeps its
    // colour and only the very centre goes hot.
    fire.alp[i] = Math.pow(heat, 1.4) * 0.52;
  }
  fire.geo.attributes.position.needsUpdate = true;
  fire.geo.attributes.aCol.needsUpdate = true;
  fire.geo.attributes.aSize.needsUpdate = true;
  fire.geo.attributes.aAlpha.needsUpdate = true;
}

function updateMotes(dt, time){
  for(let i = 0; i < motes.n; i++){
    const d = motes.data[i];
    d.x += (d.vx + Math.sin(time * 0.4 + d.ph) * 0.06) * dt;
    d.y += d.vy * dt;
    d.z += (d.vz + Math.cos(time * 0.33 + d.ph) * 0.06) * dt;
    if(d.y > 5.2){ d.y = 0.3; d.x = rnd(-9, 9); d.z = rnd(-12, 8); }
    motes.pos[i*3] = d.x; motes.pos[i*3+1] = d.y; motes.pos[i*3+2] = d.z;
    if(d.warm){ motes.col[i*3] = 1.0; motes.col[i*3+1] = 0.72; motes.col[i*3+2] = 0.40; }
    else { motes.col[i*3] = 0.66; motes.col[i*3+1] = 0.80; motes.col[i*3+2] = 1.0; }
    motes.siz[i] = d.size;
    motes.alp[i] = (0.16 + 0.24 * (0.5 + 0.5 * Math.sin(time * 1.3 + d.ph)));
  }
  motes.geo.attributes.position.needsUpdate = true;
  motes.geo.attributes.aCol.needsUpdate = true;
  motes.geo.attributes.aSize.needsUpdate = true;
  motes.geo.attributes.aAlpha.needsUpdate = true;
}

function updateSpray(dt){
  for(let i = 0; i < spray.n; i++){
    const d = spray.data[i];
    if(!valveOpen){ spray.alp[i] = 0; continue; }
    d.life += dt;
    if(d.life > d.max) resetSpray(i);
    const k = 1 - d.life / d.max;
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    d.vy -= 3.4 * dt;
    spray.pos[i*3] = d.x; spray.pos[i*3+1] = d.y; spray.pos[i*3+2] = d.z;
    spray.col[i*3] = 0.72; spray.col[i*3+1] = 0.88; spray.col[i*3+2] = 1.0;
    spray.siz[i] = d.size;
    spray.alp[i] = k * 0.5;
  }
  spray.geo.attributes.position.needsUpdate = true;
  spray.geo.attributes.aCol.needsUpdate = true;
  spray.geo.attributes.aSize.needsUpdate = true;
  spray.geo.attributes.aAlpha.needsUpdate = true;
}

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
let time = 0;

// Everything in the world that moves on its own, independent of the camera. Pulled out
// of tick() so the teaser runs the identical animation — the cinematic is the live scene,
// not a separate rig, so firelight, lantern breathing, the sea and the platter all keep
// running exactly as they do in play.
function animateWorld(dt, time){
  // firelight flicker: three detuned sines plus a little noise, so it never loops audibly
  // Raised with the lanterns for blue hour — the firepit is the warmest thing in the
  // room and has to stay that way now the sky is carrying light.
  fireLight.intensity = 4.4
    + Math.sin(time * 11.3) * 0.42
    + Math.sin(time * 17.1) * 0.26
    + Math.sin(time * 3.1) * 0.32
    + Math.random() * 0.34;
  fireLight.position.set(
    FIRE_POS.x + Math.sin(time * 5.1) * 0.07,
    FIRE_POS.y + Math.sin(time * 7.7) * 0.05,
    FIRE_POS.z + Math.cos(time * 4.3) * 0.07);

  for(let i = 0; i < LANTERN_LIGHTS.length; i++){
    const l = LANTERN_LIGHTS[i], p = l.userData.phase;
    // two slow detuned sines per lamp: oil light that breathes rather than pulses
    l.intensity = l.userData.base *
      (1 + Math.sin(time * 2.3 + p) * 0.055 + Math.sin(time * 1.7 + p * 1.6) * 0.035);
  }

  waterUniforms.uTime.value = time;
  for(let i = 0; i < CLOUDS.length; i++){
    CLOUDS[i].position.x += CLOUDS[i].userData.drift * dt;
    if(CLOUDS[i].position.x > 340) CLOUDS[i].position.x = -300;
  }

  if(recordPlaying){
    platter.rotation.y += dt * 3.49;   // 33 rpm
    tonearm.rotation.y += (0.16 - tonearm.rotation.y) * Math.min(1, 1.4 * dt);
  } else {
    tonearm.rotation.y += (-0.55 - tonearm.rotation.y) * Math.min(1, 1.4 * dt);
  }

  const wheelTarget = valveOpen ? -3.4 : 0;
  valveSpin.rotation.z += (wheelTarget - valveSpin.rotation.z) * Math.min(1, 2.4 * dt);
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  if(state === 'play') updatePlayer(dt);

  // The teaser owns the camera outright while it runs — free position, no collision,
  // no eye height, no head bob. Everything else in the loop (fire, water, lanterns,
  // audio mix) keeps running, which is what makes it a live scene and not a video.
  if(state === 'teaser'){
    Teaser.update(dt);
    Sound.update(camera.position, false, valveOpen);
    updateFire(dt, time); updateMotes(dt, time); updateSpray(dt);
    animateWorld(dt, time);
    if(COMPOSER){ if(GRADE) GRADE.uniforms.uTime.value = time; COMPOSER.render(); }
    else renderer.render(scene, camera);
    return;
  }

  // camera
  if(state === 'menu'){
    // A very slow drift behind the title screen, held on the firepit. A frozen frame
    // behind a menu reads as a screenshot; this reads as a room you are about to walk
    // into. The rates are deliberately below the threshold where the eye tracks motion.
    // Framed off-axis on purpose: the firepit and the moon's path sit to one side of
    // frame rather than dead centre behind the title, so the type always has a quiet
    // area to land on as the camera drifts.
    const a = time * 0.034;
    camera.position.set(
      -2.9 + Math.sin(a) * 2.6,
      1.70 + Math.sin(time * 0.08) * 0.08,
      4.4 + Math.cos(a * 0.8) * 1.3);
    camera.lookAt(2.6, 1.35, -4.2);
    const mf = vFov(CFG.hfovWalk);
    if(Math.abs(camera.fov - mf) > 0.05){ camera.fov = mf; camera.updateProjectionMatrix(); }
  } else {
    const eye = seated ? CFG.seatHeight : CFG.eyeHeight;
    const bobY = seated ? 0 : Math.sin(player.bob) * CFG.bobAmp;
    const bobX = seated ? 0 : Math.cos(player.bob * 0.5) * CFG.bobAmp * 0.5;
    camera.position.copy(player.pos);
    camera.position.x += Math.cos(player.yaw) * bobX;
    camera.position.z += -Math.sin(player.yaw) * bobX;
    camera.position.y += eye + bobY;
    camera.rotation.set(player.pitch, player.yaw, 0);
    const fovTarget = vFov(seated ? CFG.hfovSeat : CFG.hfovWalk);
    if(Math.abs(camera.fov - fovTarget) > 0.05){
      camera.fov += (fovTarget - camera.fov) * Math.min(1, 3 * dt);
      camera.updateProjectionMatrix();
    }
  }

  animateWorld(dt, time);

  updateFire(dt, time);
  updateMotes(dt, time);
  updateSpray(dt);

  if(state === 'play'){
    updateTarget();
    Sound.update(camera.position, !!seated, valveOpen);
  }

  if(COMPOSER){
    if(GRADE) GRADE.uniforms.uTime.value = time;
    COMPOSER.render();
  } else {
    renderer.render(scene, camera);
  }
}

// ---------------------------------------------------------------- teaser / attract mode
// An in-engine cinematic. Every frame here is the real scene with the real lighting —
// nothing is pre-rendered — so the teaser can never promise something the game does
// not actually look like.
//
// Shots are authored as a dolly: the camera eases from `a` to `b` while looking from
// `la` to `lb`. Positions are free (not clamped to eye height or collision) because
// this is a camera, not a player. Easing is smootherstep throughout — the brief for
// this world is slow and unhurried, and a linear dolly reads as a security camera.
const Teaser = (function(){
  const V = function(x, y, z){ return new THREE.Vector3(x, y, z); };

  const SHOTS = [
    { // Drifting in off the lagoon. Opens on the *front* of the pavilion — from behind
      // it is an unlit slab, and every warm thing in this world faces the water.
      a: V(6.5, 2.25, -34), b: V(4.6, 1.95, -25),
      la: V(0, 2.1, -1),    lb: V(0, 2.0, -1),
      dur: 10.0, hfov: 92
    },
    { // the symmetric hero: the pavilion seen from the terrace, firepit dead centre
      a: V(0, 1.72, -13.4), b: V(0, 1.68, -9.2),
      la: V(0, 1.5, 2),     lb: V(0, 1.35, 0.5),
      dur: 9.0,
      // Not a date. Dating the scene makes the resort sound preserved rather than
      // desirable, which is the opposite of the brief — and the image already says
      // 1965 without help. The line should carry what the picture cannot: why anyone
      // pays to be here. It also lands the title early, and the same three words will
      // turn out to describe the founder and the dead guest.
      cap: 'They come here to disappear.'
    },
    { // firelight. no caption — the room should be allowed to speak once.
      a: V(3.6, 1.5, 2.6),  b: V(1.5, 1.32, -0.5),
      la: V(0, 1.0, -2),    lb: V(0, 0.92, -2),
      dur: 7.5
    },
    { // Garmus's turntable — the pitch calls this the emotional core. Camera is above
      // the platter looking down, so the disc reads as an ellipse with the tonearm
      // across it; at deck height it was edge-on and read as nothing.
      a: V(-3.30, 2.02, 6.34), b: V(-3.72, 1.86, 6.62),
      la: V(-4.46, 1.16, 7.55), lb: V(-4.46, 1.13, 7.55),
      dur: 8.0, hfov: 72,
      cap: 'The man who built it walked into the sea.'
    },
    { // The valve: repair is investigation.
      // Re-pathed. The original dolly ended at (-7.45, -4.75) and there is a 5.4m pillar
      // at (-7.7, -4.6) — the camera finished the shot inside it. This approach comes in
      // from the open floor on the +z side and keeps better than 0.7m of clearance the
      // whole way while still looking out past the valve toward the water.
      a: V(-6.25, 1.62, -2.90), b: V(-7.05, 1.34, -3.45),
      la: V(-8.80, 1.20, -5),   lb: V(-8.85, 1.15, -5),
      dur: 7.5, hfov: 74,
      cap: 'They sent for a plumber.'
    },
    { // The locked door, now lit by its own sconce. Held wide enough to read the door,
      // the frame and the bar beyond it rather than one floating brass knob.
      a: V(3.05, 1.82, 4.30), b: V(2.78, 1.74, 5.65),
      la: V(2.42, 1.62, 8.12), lb: V(2.42, 1.58, 8.12),
      dur: 7.0,
      cap: 'By morning a guest is dead.'
    },
    { // rise and pull away
      a: V(0, 1.8, -8.5), b: V(0.5, 8.2, -25),
      la: V(0, 2.2, 1),   lb: V(0, 2.6, 2),
      dur: 11.0,
      cap: 'No one can leave. Everyone has the same motive.'
    },
    { // title, held over the moonlit water
      a: V(3.0, 2.4, -19), b: V(3.6, 2.7, -22.5),
      la: V(16, 7, -70),   lb: V(15, 7.5, -72),
      dur: 12.0, hfov: 88,
      card: true
    }
  ];

  let active = false, idx = 0, t = 0, onDone = null, cutting = false;
  // Caption and title-card visibility are latched off the same accumulated shot time as
  // the camera, not off setTimeout. Scheduling them in wall-clock time meant any
  // frame-rate variance — or a backgrounded tab — slid the words out from under the
  // pictures they belong to.
  let capOn = false, cardOn = false;
  const capEl  = document.getElementById('cap');
  const cardEl = document.getElementById('card');
  const fadeEl = document.getElementById('fade');

  // smootherstep: zero first and second derivative at both ends, so a move has no
  // detectable start or stop
  function ease(x){ x = THREE.MathUtils.clamp(x, 0, 1); return x*x*x*(x*(x*6 - 15) + 10); }

  function showCap(text){
    if(!text){ capEl.classList.remove('on'); return; }
    capEl.textContent = text;
    capEl.classList.add('on');
  }

  function beginShot(i){
    idx = i; t = 0;
    capOn = false; cardOn = false;
    showCap(null);
    cardEl.classList.remove('on');
  }

  function finish(){
    if(!active) return;
    active = false;
    state = 'menu';
    if(BOKEH) BOKEH.enabled = false;   // play stays sharp
    document.body.classList.remove('cine');
    showCap(null);
    cardEl.classList.remove('on');
    fadeEl.style.opacity = 1;
    Sound.stopMusic();
    recordPlaying = false;
    setTimeout(function(){
      fadeEl.style.opacity = 0;
      if(onDone) onDone();
    }, 900);
  }

  return {
    running: function(){ return active; },
    // Runs the sequence. Audio has already been unlocked by the click that got here,
    // so the record can start with the picture.
    start: function(done){
      onDone = done || null;
      active = true;
      cutting = false;
      capOn = false; cardOn = false;
      state = 'teaser';
      seated = null;
      if(BOKEH) BOKEH.enabled = true;   // shallow focus for the reel only
      document.body.classList.add('cine');
      cardEl.classList.remove('on');
      fadeEl.style.opacity = 1;
      try {
        Sound.init(); Sound.resume();
        // side one, track one: "Midnight Case on Kalakaua"
        if(Sound.hasLibrary()){ Sound.playTrack(0); recordPlaying = true; }
        else { Sound.startMusic(); recordPlaying = true; }
      } catch(e){ /* silent teaser is still a teaser */ }
      beginShot(0);
      // hold on black for a moment, then open
      setTimeout(function(){ fadeEl.style.opacity = 0; }, 700);
    },
    skip: function(){ if(active) finish(); },
    update: function(dt){
      if(!active) return;
      const s = SHOTS[idx];
      if(!s){ finish(); return; }
      t += dt;

      // The caption arrives a beat after the cut so the image lands first, and leaves
      // before the cut so it never straddles two shots.
      if(s.cap){
        const want = t > 1.5 && t < s.dur - 1.2;
        if(want !== capOn){ capOn = want; showCap(want ? s.cap : null); }
      }
      if(s.card && !cardOn && t > 2.2){ cardOn = true; cardEl.classList.add('on'); }

      const k = ease(t / s.dur);
      camera.position.lerpVectors(s.a, s.b, k);
      const look = new THREE.Vector3().lerpVectors(s.la, s.lb, k);
      camera.lookAt(look);

      // Focus rides the look target, so whatever the shot is pointed at is what is
      // sharp — no per-shot focus numbers to hand-tune and none to get out of sync
      // when a camera move is retimed.
      if(BOKEH && BOKEH.enabled){
        const u = BOKEH.uniforms || (BOKEH.materialBokeh && BOKEH.materialBokeh.uniforms);
        if(u && u.focus) u.focus.value = camera.position.distanceTo(look);
      }
      // the fov breathes very slightly inward across each shot: a long lens settling.
      // `hfov` lets a shot pick its own focal length — close work wants a longer lens
      // than an establishing wide, and shooting everything at one fov is what makes a
      // reel feel like a camera on rails rather than a cut sequence.
      const targetFov = vFov(s.hfov || CFG.hfovWalk) * (1 - 0.035 * k);
      if(Math.abs(camera.fov - targetFov) > 0.01){
        camera.fov = targetFov;
        camera.updateProjectionMatrix();
      }
      if(t >= s.dur && !cutting){
        if(idx + 1 < SHOTS.length){
          // A short dip to black between shots reads as an edit rather than a teleport.
          // `cutting` latches so this fires once, not once per frame while we wait.
          cutting = true;
          fadeEl.style.opacity = 1;
          const next = idx + 1;
          setTimeout(function(){
            if(!active) return;
            beginShot(next);
            cutting = false;
            fadeEl.style.opacity = 0;
          }, 520);
        } else {
          finish();
        }
      }
    },
    totalSeconds: SHOTS.reduce(function(a, s){ return a + s.dur; }, 0),
    shotCount: SHOTS.length,
    // Park the camera at shot `i`, progress `k` (0..1), and render one frame. Used to
    // review and tune framing without sitting through the reel in real time.
    preview: function(i, k){
      const s = SHOTS[i];
      if(!s) return null;
      const e = ease(k);
      const look = new THREE.Vector3().lerpVectors(s.la, s.lb, e);
      camera.position.lerpVectors(s.a, s.b, e);
      camera.lookAt(look);
      camera.fov = vFov(s.hfov || CFG.hfovWalk) * (1 - 0.035 * e);
      if(BOKEH){
        const u = BOKEH.uniforms || (BOKEH.materialBokeh && BOKEH.materialBokeh.uniforms);
        if(u && u.focus) u.focus.value = camera.position.distanceTo(look);
      }
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld(true);
      animateWorld(0.016, 3.2);
      updateFire(0.016, 3.2); updateMotes(0.016, 3.2);
      if(COMPOSER){ if(GRADE) GRADE.uniforms.uTime.value = 3.2; COMPOSER.render(); }
      else renderer.render(scene, camera);
      return {shot: i, k: k, cap: s.cap || null, card: !!s.card,
              pos: camera.position.toArray().map(function(v){ return +v.toFixed(2); })};
    }
  };
})();

// ---------------------------------------------------------------- boot / screens
const startEl = document.getElementById('start');
const pauseEl = document.getElementById('pause');
const dropEl = document.getElementById('drop');

// Controls are taught once, on first entry, and then never shown again — a title
// screen that permanently lists its own keybindings reads as a debug build.
let tutorShown = false;
function showTutor(){
  if(tutorShown) return;
  tutorShown = true;
  const el = document.getElementById('tutor');
  if(!el) return;
  setTimeout(function(){ el.classList.add('on'); }, 900);
  setTimeout(function(){ el.classList.remove('on'); }, 8600);
}

// Settings live behind one quiet word rather than on the front page.
(function(){
  const t = document.getElementById('prefsToggle');
  const p = document.getElementById('prefs');
  if(!t || !p) return;
  t.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    p.classList.toggle('open');
    t.textContent = p.classList.contains('open') ? 'Close' : 'Settings';
  });
})();

function enter(){
  // The title screen has a catch-all click handler, so a click on "Teaser" can reach
  // here too. Never let entering play stomp a running reel.
  if(Teaser.running()) return;
  showTutor();
  // clear the UI first: if audio fails, the player is still in the scene
  state = 'play';
  startEl.style.display = 'none';
  pauseEl.style.display = 'none';
  const l = document.getElementById('loading');
  if(l) l.style.display = 'none';
  try {
    if(!isTouch && canvas.requestPointerLock) canvas.requestPointerLock();
  } catch(e){ /* pointer lock is optional */ }
  try {
    Sound.init();
    Sound.resume();
  } catch(e){
    note('Audio unavailable on this device.');
  }
}

function bindEnter(el){
  if(!el) return;
  ['click', 'touchend', 'pointerup'].forEach(function(ev){
    el.addEventListener(ev, function(e){
      e.preventDefault();
      e.stopPropagation();
      enter();
    }, {passive: false});
  });
}
bindEnter(document.getElementById('enterBtn'));
bindEnter(document.getElementById('resumeBtn'));

// The teaser. Clicking is also the gesture that unlocks the AudioContext, which is why
// the sequence is started from a button rather than auto-playing on load — an attract
// reel with no soundtrack would undersell the whole thing.
(function(){
  const btn = document.getElementById('teaserBtn');
  if(!btn) return;
  ['click', 'touchend', 'pointerup'].forEach(function(ev){
    btn.addEventListener(ev, function(e){
      e.preventDefault(); e.stopPropagation();
      if(Teaser.running()) return;
      startEl.style.display = 'none';
      pauseEl.style.display = 'none';
      const l = document.getElementById('loading'); if(l) l.style.display = 'none';
      Teaser.start(function(){ startEl.style.display = 'flex'; });
    }, {passive: false});
  });
})();

// Any input skips the reel, the way any attract mode should behave.
['keydown', 'mousedown', 'touchstart'].forEach(function(ev){
  addEventListener(ev, function(){ if(Teaser.running()) Teaser.skip(); }, {passive: true});
});

// tapping anywhere on a title screen also enters — except the file picker
[startEl, pauseEl].forEach(function(el){
  el.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.load, .opts, #prefs, #prefsToggle')) return;
    enter();
  });
});

// touch devices get their own control hints
if(isTouch){
  const k = document.querySelector('#start .keys');
  if(k) k.innerHTML = 'Drag the left side — walk<br>Drag the right side — look<br>Tap — interact';
}

document.addEventListener('pointerlockchange', function(){
  if(state === 'play' && !document.pointerLockElement && !isTouch){
    state = 'paused';
    pauseEl.style.display = 'flex';
    document.getElementById('prompt').style.opacity = 0;
  }
});

document.getElementById('musicFile').addEventListener('change', function(e){
  if(e.target.files && e.target.files[0]){
    Sound.loadFile(e.target.files[0], function(ok){
      note(ok ? 'Record loaded. Drop the needle in the lounge.' : 'That file would not decode.');
    });
  }
});
['dragenter', 'dragover'].forEach(function(ev){
  addEventListener(ev, function(e){ e.preventDefault(); dropEl.style.display = 'flex'; });
});
['dragleave', 'drop'].forEach(function(ev){
  addEventListener(ev, function(e){ e.preventDefault(); dropEl.style.display = 'none'; });
});
addEventListener('drop', function(e){
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) Sound.loadFile(f, function(ok){
    note(ok ? 'Record loaded.' : 'That file would not decode.');
    if(ok && recordPlaying){ Sound.stopMusic(); setTimeout(function(){ Sound.startMusic(); }, 400); }
  });
});

if(CFG.musicUrl) Sound.loadUrl(CFG.musicUrl, function(){});

// Fetch the album catalog up front so the record player has something on it the
// first time it's used. Failure is not an error: on file:// the fetch is blocked
// and the generative loop stands in, exactly as before.
if(CFG.libraryUrl){
  Sound.loadLibrary(CFG.libraryUrl, function(ok, lib){
    const el = document.getElementById('libInfo');
    // Tucked inside Settings now. The album's length is not something a title screen
    // should be announcing.
    if(el) el.textContent = ok ? lib.title : 'serve over http for the album';
  });
}

// Comfort controls. These are the settings most likely to be causing discomfort,
// so they belong in the hands of whoever can actually see the screen.
(function(){
  const bob = document.getElementById('optBob');
  const grain = document.getElementById('optGrain');
  const fov = document.getElementById('optFov');
  const sens = document.getElementById('optSens');
  if(bob) bob.addEventListener('change', function(){
    CFG.bobAmp = bob.checked ? 0.028 : 0.0;
  });
  if(grain) grain.addEventListener('change', function(){
    // grain lives in the grade shader now; the CSS overlay is only the fallback path
    if(GRADE){ GRADE.uniforms.uGrain.value = grain.checked ? 0.030 : 0.0; return; }
    const el = document.getElementById('grain');
    if(el) el.style.display = grain.checked ? 'block' : 'none';
  });
  if(fov) fov.addEventListener('input', function(){
    CFG.hfovWalk = +fov.value;
    CFG.hfovSeat = +fov.value * 0.82;
    resize();
  });
  if(sens) sens.addEventListener('input', function(){
    CFG.lookGainMouse = (+sens.value / 100) * 1.35;
    CFG.lookGainTouch = (+sens.value / 100);
  });
})();

function checkOrientation(){
  const el = document.getElementById('rotate');
  if(!el) return;
  el.style.display = (isTouch && innerHeight > innerWidth) ? 'flex' : 'none';
}
addEventListener('resize', checkOrientation);
addEventListener('orientationchange', function(){ setTimeout(checkOrientation, 300); });
checkOrientation();

// ---------------------------------------------------------------- image-based lighting
// The single largest visual upgrade available to this scene. Every metal here —
// brass, bronze, verdigris copper — was authored with high metalness and had nothing
// to reflect, and a metal with no environment renders very nearly black. Capturing
// the finished room into a cubemap once and handing it to scene.environment gives all
// of them the lagoon, the moon, the fire and the lanterns to pick up, which is the
// difference between "grey plastic" and "polished brass".
//
// Captured from standing height near the firepit so the IBL carries the room's real
// story: dark wood on three sides, cool moonlit water on the fourth, warm fire below.
(function buildEnvironment(){
  try {
    const rt = new THREE.WebGLCubeRenderTarget(256, {
      format: THREE.RGBAFormat,
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    const cam = new THREE.CubeCamera(0.4, 400, rt);
    cam.position.set(0, 1.9, 0.4);
    // Sprites, particles and the additive haze cones would all smear into the capture
    // as bright blobs and then get reflected by every metal in the room.
    const hidden = [];
    scene.traverse(function(o){
      if(o.isPoints || (o.material && o.material.isSpriteMaterial) ||
         (o.material && o.material.blending === THREE.AdditiveBlending)){
        hidden.push(o); o.visible = false;
      }
    });
    cam.update(renderer, scene);
    hidden.forEach(function(o){ o.visible = true; });

    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileCubemapShader();
    ENV_MAP = pmrem.fromCubemap(rt.texture).texture;
    pmrem.dispose();
    rt.dispose();

    scene.environment = ENV_MAP;

    // Per-material reflectivity. Uniform IBL flattens everything, so the metals get
    // to shine and the matte surfaces (thatch, rattan, fabric) stay matte.
    const gloss = {
      // copper is dropped well below the other metals: it is a long run of pipe in the
      // open, and at 1.15 the environment reflection alone made it the palest thing in
      // the arrival shot regardless of how far its base colour came down.
      brass: 1.55, bronze: 1.30, copper: 0.50, vinyl: 1.25, glass: 1.5,
      bottle: 1.2, liquid: 1.1, wet: 0.95, stream: 1.2,
      floor: 0.62, panel: 0.30, pillar: 0.38, beam: 0.22,
      rattan: 0.18, fabric: 0.20, stone: 0.24, mat: 0.14,
      thatch: 0.10, dark: 0.30, petal: 0.35, leaf: 0.22, frond: 0.18
    };
    Object.keys(gloss).forEach(function(k){
      if(M[k] && M[k].isMeshStandardMaterial){
        M[k].envMap = ENV_MAP;
        M[k].envMapIntensity = gloss[k];
        M[k].needsUpdate = true;
      }
    });

    // Brass and bronze were authored rough enough to kill the reflection they now
    // have. Tighten them so the highlight reads as metal rather than as grey.
    M.brass.roughness = 0.22;  M.brass.metalness = 0.95;
    M.bronze.roughness = 0.34; M.bronze.metalness = 0.85;
    M.copper.roughness = 0.52; M.copper.metalness = 0.70;
    M.vinyl.roughness = 0.20;  M.vinyl.metalness = 0.30;
    [M.brass, M.bronze, M.copper, M.vinyl].forEach(function(m){ m.needsUpdate = true; });
  } catch(e){
    // IBL is an enhancement, never a dependency — the scene must still boot without it
    if(window.console) console.warn('environment capture skipped:', e && e.message);
  }
})();

// The grade shader draws its own vignette and grain, so retire the CSS overlays that
// were standing in for them — keeping both would double the effect.
if(COMPOSER){
  const v = document.getElementById('vig'); if(v) v.style.display = 'none';
  const g = document.getElementById('grain'); if(g) g.style.display = 'none';
}

// first frame, then reveal the menu
renderer.compile(scene, camera);
tick();
setTimeout(function(){
  document.getElementById('loading').style.display = 'none';
  startEl.style.display = 'flex';
}, 120);

/* ------------------------------------------------------------------ capture mode
   Development only. Load with a hash to render one fixed framing and push it to
   the browser's download folder, e.g.

       index.html#shot=hero&t=6&w=1280&h=720

   The frame is POSTed to scripts/serve.ps1, which writes it to renders/. Getting a
   frame back out is otherwise awkward here: the browser pane is never displayed, so
   it never composites and the screenshot tool times out on a blank surface, and a
   canvas -> <a download> click only works once (Chrome permits a single automatic
   download per origin before it asks a permission question that nothing can answer
   with no UI on screen). A POST has neither limit.

   One framing per load, driven entirely by the URL, so a capture is a plain reload
   and every frame starts from an identical boot.

   Two consequences of the pane being hidden, both worked around here:
     * rAF does not fire, so tick() never advances the world. warm() steps it by hand.
     * because tick() is not running, the camera can be set directly -- normally it is
       overwritten from `player` every frame. */
const CAPTURE = (function(){
  // Query string first, hash as a fallback. Some of the harnesses that drive this
  // drop the fragment when they navigate, and a silently ignored #shot= looks
  // exactly like a capture that ran and produced nothing.
  const q = new URLSearchParams(location.search || '');
  if(!q.has('shot') && location.hash) {
    new URLSearchParams(location.hash.slice(1)).forEach((v, k) => q.set(k, v));
  }
  if(!q.has('shot')) return null;

  // Fixed framings. These are the shots the look is reviewed on, and they must not
  // drift: comparing two lighting passes is meaningless if the camera moved too.
  // `hero` is the pitch's signature shot and the framing reference/target.png matches.
  const SHOTS = {
    hero:    { pos:[-2.9, 1.70,  4.4], at:[ 2.6, 1.35, -4.2], hfov:72 },
    seaward: { pos:[ 0.0, 1.68,  1.0], at:[ 0.0, 1.55,-20.0], hfov:85 },
    firepit: { pos:[-1.2, 1.68,  2.2], at:[ 1.4, 0.90, -1.2], hfov:85 },
    terrace: { pos:[ 0.5, 1.68, -5.5], at:[ 1.0, 1.40,-20.0], hfov:85 },
    // Exterior. The build has only ever been reviewed from inside, which is exactly how
    // the pavilion got to be an unlit slab with a flat back — nobody had a framing that
    // pointed at it. These are the arrival views the pitch's first two prompts describe.
    arrival: { pos:[ 2.0, 2.40,-25.0], at:[ 0.0, 2.20, -2.0], hfov:78 },
    island:  { pos:[-30.0, 9.50,-34.0], at:[ 0.0, 1.50,  0.0], hfov:82 },
    beach:   { pos:[ 17.0, 2.10,-17.0], at:[-2.0, 1.60, -2.0], hfov:85 },
  };
  const shot = SHOTS[q.get('shot')];
  if(!shot) return null;

  const w = +(q.get('w') || 1280), h = +(q.get('h') || 720);
  const warmTo = +(q.get('t') || 6);

  state = 'capture';                       // keeps tick()'s menu drift off the camera
  const ui = document.getElementById('start'); if(ui) ui.style.display = 'none';
  const ld = document.getElementById('loading'); if(ld) ld.style.display = 'none';

  // Pin the pixel ratio so "1280x720" is 1280x720 on any display, and keep the CSS
  // size in step with the backing store (see the setSize note further up -- letting
  // those two diverge is what caused the motion sickness bug).
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  camera.aspect = w / h;
  if(COMPOSER){ COMPOSER.setPixelRatio(1); COMPOSER.setSize(w, h); }

  // Fixed timestep rather than wall clock: fire, water, motes and lanterns are all
  // time-driven, so a frame is only reproducible if the phase is.
  const step = 1/30;
  time = 0;
  for(let i = 0, n = Math.round(warmTo/step); i < n; i++){
    time += step;
    animateWorld(step, time);
    updateFire(step, time);
    updateMotes(step, time);
    updateSpray(step);
  }

  camera.position.set(shot.pos[0], shot.pos[1], shot.pos[2]);
  camera.lookAt(shot.at[0], shot.at[1], shot.at[2]);
  camera.fov = vFov(shot.hfov);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);

  if(COMPOSER){ if(GRADE) GRADE.uniforms.uTime.value = time; COMPOSER.render(); }
  else renderer.render(scene, camera);

  // The renderer has no preserveDrawingBuffer, so the colour buffer is only valid in
  // the same synchronous task as the draw. toBlob is async and would race the clear,
  // so read back with toDataURL and build the Blob from that.
  const url = canvas.toDataURL('image/png');
  const bin = atob(url.slice(url.indexOf(',') + 1));
  const buf = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const blob = new Blob([buf], {type:'image/png'});

  // The title is the completion signal: the caller polls it rather than guessing
  // how long a boot takes. It must only say OK once the bytes are actually on disk,
  // so it is set from the response, not from the request.
  const name = q.get('as') || q.get('shot');
  document.title = 'CAPTURE POSTING ' + blob.size;
  fetch('/__shot?name=' + encodeURIComponent(name), {method:'POST', body: blob})
    .then(r => r.text())
    .then(t => { document.title = 'CAPTURE OK ' + w + 'x' + h + ' ' + t; })
    .catch(e => { document.title = 'CAPTURE FAIL ' + e.message; });

  return {w, h, bytes: blob.size, t: time};
})();
